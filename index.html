<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b141e">
    <title>Straidhold</title>
  </head>
  <body>
    <main id="app">
      <header class="match-header">
        <div class="wordmark">STRAIDHOLD <span>試作 0.2.1</span></div>
        <div class="scoreboard" aria-label="スコアと残り時間">
          <span class="score blue"><span>青</span> <strong id="blue-score">0</strong></span>
          <time id="clock">05:00</time>
          <span class="score red"><strong id="red-score">0</strong> <span>赤</span></span>
        </div>
        <button id="open-settings" class="secondary" type="button">操作設定</button>
      </header>
      <div class="tactical-strip">
        <section id="roster" aria-label="チームの生存状況"></section>
        <section id="sites" class="site-strip" aria-label="拠点の状態"></section>
      </div>
      <section id="battlefield" class="battlefield" aria-label="戦場">
        <div id="game"></div>
        <div id="map-labels" aria-hidden="true"></div>
        <div id="touch-controls" hidden>
          <div id="stick"><span id="knob"></span></div>
          <div id="touch-fire" class="touch-button">攻撃</div>
          <div id="touch-deploy" class="touch-button">設置</div>
        </div>
        <div id="respawn" class="respawn" role="status" hidden></div>
        <section id="overlay" class="overlay" aria-label="マッチメニュー">
          <div class="briefing">
            <p id="briefing-mode" class="eyebrow">5対5 / 拠点占領</p>
            <h1 id="headline">Straidhold</h1>
            <p id="mission">占領装置を設置し、起動まで拠点を守れ。</p>
            <div class="map-picker">
              <label for="map-select">戦場</label>
              <select id="map-select"></select>
              <div id="map-preview" aria-hidden="true"></div>
              <p id="map-description"></p>
            </div>
            <button id="start" class="primary" type="button" disabled>試合開始</button>
          </div>
        </section>
        <div id="rotate" aria-hidden="true">横画面にすると操作しやすくなります</div>
      </section>
      <footer id="hud" class="match-footer">
        <div class="vitals">
          <div class="vital"><label for="hp">HP</label><meter id="hp" min="0" max="100" value="100"></meter><output id="hp-value">100</output></div>
          <div class="vital"><label for="shield">シールド</label><meter id="shield" min="0" max="100" value="100"></meter><output id="shield-value">100</output></div>
        </div>
        <div class="actions"><span id="attack-state">攻撃待機</span><span id="deploy-state">拠点に近づくと設置可能</span><span id="terrain-state" hidden></span></div>
        <div id="input-hint" class="input-hint"></div>
      </footer>
    </main>

    <dialog id="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title">操作設定</h2>
        <label>操作モード
          <select name="mode">
            <option value="auto">自動</option>
            <option value="keyboard">キーボード・マウス</option>
            <option value="touch">タッチ</option>
            <option value="gamepad">ゲームパッド</option>
          </select>
        </label>
        <label>仮想スティック
          <select name="stick">
            <option value="fixed">固定</option>
            <option value="floating">浮動</option>
            <option value="follow">追従</option>
          </select>
        </label>
        <label>大きさ <output id="size-label"></output>
          <input type="range" name="size" min="24" max="68" step="1">
        </label>
        <label>透明度 <output id="opacity-label"></output>
          <input type="range" name="opacity" min="25" max="100" step="1">
        </label>
        <label>デッドゾーン <output id="dead-zone-label"></output>
          <input type="range" name="deadZone" min="0" max="45" step="1">
        </label>
        <button class="primary" type="submit">閉じる</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
